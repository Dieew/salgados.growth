<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Como fazer 20k sem sair de casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* massa e fritura: marrom tostado, creme e dourado */
    --ink:#1E1410;
    --dark:#241811;
    --dark-2:#2E1F16;
    --dark-line:#3D2B20;
    --cream:#FAF5EC;
    --cream-2:#FFFFFF;
    --cream-line:#E8DECD;
    --gold:#F7B733;
    --gold-deep:#E09A16;
    --ember:#D6452B;
    --text-light:#FFF8EE;
    --muted-light:#C3AF9E;
    --muted-dark:#6E6055;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --r:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;scroll-padding-top:calc(82px + var(--safe-t));}
  body{
    background:var(--dark);color:var(--text-light);
    font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;
    padding-top:var(--safe-t);overflow-x:hidden;
  }
  img,svg{max-width:100%;display:block;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px;}

  h1,h2,h3,.brand,.price-big,.stat b{font-family:'Outfit',sans-serif;letter-spacing:-0.03em;}
  h1{font-size:clamp(2.3rem,1.6rem + 3.4vw,3.9rem);line-height:1.05;font-weight:800;}
  h2{font-size:clamp(1.7rem,1.3rem + 2vw,2.5rem);line-height:1.12;font-weight:800;max-width:19ch;}
  .hl{color:var(--gold);}
  .hl-2{color:var(--ember);}

  .eyebrow{display:flex;align-items:center;gap:10px;font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;}
  .eyebrow::before{content:"";width:26px;height:1px;background:currentColor;flex:0 0 auto;}
  .lead{color:var(--muted-light);max-width:58ch;margin-top:14px;font-size:1rem;}

  /* ---- BOTÃO PÍLULA COM SELO DE SETA ---- */
  .btn{
    display:inline-flex;align-items:center;gap:12px;background:var(--gold);color:#241811;
    border:none;border-radius:999px;padding:8px 8px 8px 24px;font-family:'Figtree',sans-serif;
    font-weight:700;font-size:1rem;text-decoration:none;cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .btn::after{
    content:"↗";display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--gold);
    font-size:.95rem;flex:0 0 auto;
  }
  .btn:hover{background:var(--gold-deep);transform:translateY(-1px);}
  .btn:focus-visible{outline:3px solid var(--ember);outline-offset:3px;}
  .btn-sm{padding:6px 6px 6px 18px;font-size:.88rem;}
  .btn-sm::after{width:30px;height:30px;font-size:.85rem;}
  .btn-dark{background:var(--ink);color:var(--gold);}
  .btn-dark::after{background:var(--gold);color:var(--ink);}
  .btn-dark:hover{background:#150D09;}

  /* ---- TOPO FIXO ---- */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(36,24,17,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--dark-line);}
  .topbar .wrap{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px;}
  .brand{font-weight:800;font-size:1.15rem;white-space:nowrap;}
  .brand span{color:var(--gold);}
  .timer{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(247,183,51,.45);background:rgba(247,183,51,.1);color:var(--gold);border-radius:999px;padding:7px 14px;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
  .timer b{font-variant-numeric:tabular-nums;font-size:.9rem;letter-spacing:.02em;}
  .topbar-note{color:var(--muted-light);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .btn{margin-left:auto;}

  /* ---- FAIXA CORRIDA ---- */
  .marquee{background:var(--gold);color:#241811;overflow:hidden;padding:10px 0;}
  .marquee-track{display:flex;gap:40px;width:max-content;animation:slide 26s linear infinite;font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;}
  @keyframes slide{to{transform:translateX(-50%);}}

  /* ---- SEÇÕES ---- */
  section{padding:76px 0;}
  .light{background:var(--cream);color:var(--ink);}
  .light .lead,.light p{color:var(--muted-dark);}
  .light .eyebrow{color:var(--ember);}
  .light h2,.light h3{color:var(--ink);}
  .curve{display:block;width:100%;height:46px;}
  .curve.to-dark{background:var(--cream);}
  .curve.to-light{background:var(--dark);}

  /* ---- HERO ---- */
  .hero{padding:72px 0 56px;}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center;}
  .hero p{color:var(--muted-light);margin-top:20px;max-width:46ch;}
  .hero .btn{margin-top:28px;}
  .hero-checks{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px;color:var(--muted-light);font-size:.82rem;}
  .hero-checks span{display:inline-flex;align-items:center;gap:7px;}
  .tick{width:17px;height:17px;border-radius:50%;background:rgba(247,183,51,.16);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:.6rem;flex:0 0 auto;}
  .hero-media{border-radius:26px;overflow:hidden;border:1px solid var(--dark-line);background:linear-gradient(160deg,#3A2718,#241811);aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;}
  .hero-media p{color:var(--muted-light);font-size:.84rem;max-width:26ch;}
  .hero-media video,.hero-media img,.hero-media iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;}
  .hero-tag{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:9px;background:rgba(255,248,238,.95);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:.76rem;font-weight:600;}
  .hero-tag i{width:9px;height:9px;border-radius:50%;background:var(--ember);display:block;}

  /* ---- CARDS DE NÚMERO ---- */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:34px;}
  .stat{background:var(--cream-2);border:1px solid var(--cream-line);border-radius:var(--r);padding:24px 20px;}
  .stat-ico{width:38px;height:38px;border-radius:12px;background:rgba(214,69,43,.1);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .stat-ico svg{width:19px;height:19px;stroke:var(--ember);fill:none;stroke-width:1.8;}
  .stat b{display:block;font-size:1.75rem;font-weight:800;color:var(--ember);line-height:1.1;}
  .stat span{font-size:.84rem;color:var(--muted-dark);display:block;margin-top:6px;}
  .disclaimer{color:var(--muted-dark);font-size:.75rem;margin-top:22px;max-width:70ch;}

  /* ---- LISTA DE ENTREGÁVEIS ---- */
  .deliver{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:34px;}
  .deliver-item{background:var(--dark-2);border:1px solid var(--dark-line);border-radius:16px;padding:18px 20px;display:flex;gap:13px;align-items:flex-start;font-size:.92rem;}
  .deliver-item .tick{background:rgba(247,183,51,.18);margin-top:3px;}
  .light .deliver-item{background:var(--cream-2);border-color:var(--cream-line);color:var(--ink);}
  .light .deliver-item .tick{background:rgba(214,69,43,.12);color:var(--ember);}

  /* ---- DESTAQUE / BÔNUS EM MOLDURA ---- */
  .frame{border:1.5px solid var(--gold);border-radius:var(--r);padding:26px;margin-top:20px;background:rgba(247,183,51,.05);}
  .frame .eyebrow{margin-bottom:10px;}
  .frame h3{font-size:1.25rem;font-weight:700;margin-bottom:8px;}
  .frame p{color:var(--muted-light);font-size:.92rem;max-width:62ch;}

  /* ---- CALCULADORA ---- */
  .calc{display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:center;margin-top:34px;background:var(--cream-2);border:1px solid var(--cream-line);border-radius:var(--r);padding:30px;}
  .calc-field{margin-bottom:22px;}
  .calc-field:last-child{margin-bottom:0;}
  .calc-field label{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted-dark);margin-bottom:10px;}
  .calc-field label b{color:var(--ink);font-weight:700;}
  .calc input[type=range]{width:100%;accent-color:var(--ember);height:4px;}
  .calc-out{background:var(--ink);border-radius:18px;padding:26px 22px;text-align:center;color:var(--text-light);}
  .calc-out small{color:var(--muted-light);font-size:.8rem;display:block;}
  .calc-out b{display:block;font-family:'Outfit',sans-serif;font-size:2.1rem;font-weight:800;color:var(--gold);letter-spacing:-.03em;margin:8px 0 4px;}
  .calc-note{color:var(--muted-dark);font-size:.75rem;margin-top:16px;}

  /* ---- DUAS COLUNAS (serve / não serve) ---- */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:34px;}
  .col{background:var(--dark-2);border:1px solid var(--dark-line);border-radius:var(--r);padding:26px;}
  .col.on{border-color:var(--gold);background:rgba(247,183,51,.06);}
  .col h3{font-size:1.05rem;font-weight:700;margin-bottom:16px;}
  .col ul{list-style:none;display:flex;flex-direction:column;gap:11px;}
  .col li{display:flex;gap:11px;font-size:.9rem;color:var(--muted-light);line-height:1.5;}
  .col li i{font-style:normal;flex:0 0 auto;font-weight:700;}
  .col.on li i{color:var(--gold);}
  .col.off li i{color:#7A6857;}

  /* ---- QUEM CRIOU ---- */
  .about{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;}
  .about-media{border-radius:26px;overflow:hidden;border:1px solid var(--dark-line);background:linear-gradient(160deg,#3A2718,#241811);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;position:relative;}
  .about-media p{color:var(--muted-light);font-size:.84rem;}
  .about-media img,.about-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px;}
  .chip{border:1px solid var(--dark-line);background:var(--dark-2);border-radius:999px;padding:8px 15px;font-size:.8rem;color:var(--text-light);}

  /* ---- DEPOIMENTOS ---- */
  .testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px;}
  .testi{background:var(--cream-2);border:1px solid var(--cream-line);border-radius:18px;padding:14px;}
  .testi-badge{display:inline-block;background:var(--cream);border:1px solid var(--cream-line);color:var(--muted-dark);font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:999px;margin-bottom:12px;}
  .wa{background:#E9DDCE;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .wa div{max-width:88%;padding:9px 11px;border-radius:9px;font-size:.82rem;line-height:1.45;color:#191919;}
  .wa .in{align-self:flex-start;background:#fff;border-top-left-radius:3px;}
  .wa .out{align-self:flex-end;background:#DCF8C6;border-top-right-radius:3px;}
  .wa time{display:block;text-align:right;font-size:.63rem;color:#5B8A5B;margin-top:4px;}

  /* ---- BÔNUS ---- */
  .bonus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px;}
  .bonus{background:var(--cream-2);border:1px solid var(--cream-line);border-radius:var(--r);overflow:hidden;}
  .bonus-top{background:linear-gradient(150deg,#2E1F16,#4A2F1C);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;}
  .bonus-top span{font-family:'Outfit',sans-serif;font-weight:800;font-size:1.15rem;color:var(--gold);line-height:1.15;}
  .bonus-body{padding:18px;}
  .bonus-tag{display:inline-block;background:rgba(214,69,43,.1);color:var(--ember);font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-bottom:10px;}
  .bonus h4{font-family:'Outfit',sans-serif;font-size:1rem;font-weight:700;color:var(--ink);margin-bottom:5px;}
  .bonus p{font-size:.82rem;color:var(--muted-dark);}

  /* ---- OFERTA ---- */
  .offer{max-width:720px;margin:34px auto 0;background:var(--cream-2);border-radius:26px;padding:38px 34px;color:var(--ink);text-align:center;}
  .price-anchor{color:var(--muted-dark);text-decoration:line-through;font-size:.95rem;}
  .price-label{color:var(--muted-dark);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;margin-top:6px;}
  .price-big{font-size:clamp(2.8rem,2rem + 3vw,3.6rem);font-weight:800;color:var(--ember);line-height:1;margin:6px 0 4px;}
  .price-sub{color:var(--muted-dark);font-size:.86rem;}
  .offer-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin:26px 0 28px;}
  .offer-list div{display:flex;gap:10px;font-size:.87rem;color:var(--ink);}
  .offer-list .tick{background:rgba(214,69,43,.12);color:var(--ember);margin-top:3px;}
  .offer .btn{width:100%;justify-content:space-between;background:var(--ember);color:#fff;padding:12px 12px 12px 26px;font-size:1.02rem;}
  .offer .btn::after{background:#fff;color:var(--ember);width:40px;height:40px;}
  .offer .btn:hover{background:#B63722;}
  .secure{color:var(--muted-dark);font-size:.76rem;margin-top:14px;}

  /* ---- GARANTIA ---- */
  .guarantee{display:flex;gap:24px;align-items:center;max-width:720px;margin:20px auto 0;background:var(--dark-2);border:1px solid var(--dark-line);border-radius:var(--r);padding:24px;}
  .seal{flex:0 0 auto;width:92px;height:92px;border-radius:50%;background:var(--gold);color:#241811;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05;}
  .seal b{font-family:'Outfit',sans-serif;font-size:1.6rem;font-weight:800;}
  .seal span{font-size:.6rem;font-weight:700;max-width:66px;}
  .guarantee h3{font-size:1.05rem;font-weight:700;margin-bottom:6px;}
  .guarantee p{color:var(--muted-light);font-size:.89rem;}

  /* ---- FAQ ---- */
  .faq{display:flex;flex-direction:column;gap:10px;margin-top:30px;}
  .faq details{background:var(--cream-2);border:1px solid var(--cream-line);border-radius:16px;overflow:hidden;}
  .faq summary{list-style:none;cursor:pointer;padding:18px 20px;font-weight:600;font-size:.96rem;color:var(--ink);display:flex;justify-content:space-between;gap:14px;align-items:center;}
  .faq summary::-webkit-details-marker{display:none;}
  .faq summary i{font-style:normal;color:var(--ember);transition:transform .2s ease;flex:0 0 auto;}
  .faq details[open] summary i{transform:rotate(180deg);}
  .faq .body{padding:0 20px 18px;color:var(--muted-dark);font-size:.9rem;}

  /* ---- FECHAMENTO + RODAPÉ ---- */
  .closing{text-align:center;padding:84px 0 60px;}
  .closing h2{margin:0 auto;max-width:17ch;}
  .closing p{color:var(--muted-light);margin:16px auto 0;max-width:46ch;}
  .closing .btn{margin-top:28px;}
  .closing .hero-checks{justify-content:center;}
  footer{padding:0 0 calc(40px + var(--safe-b));}
  .foot-card{background:#150D09;border-radius:26px;padding:34px;}
  .foot-top{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;}
  .foot-card .brand{display:block;margin-bottom:8px;}
  .foot-card .desc{color:var(--muted-light);font-size:.85rem;max-width:34ch;}
  .foot-links{display:flex;gap:44px;flex-wrap:wrap;}
  .foot-links h5{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
  .foot-links a{display:block;color:var(--text-light);text-decoration:none;font-size:.87rem;padding:4px 0;}
  .foot-links a:hover{color:var(--gold);}
  .legal{color:#8A7768;font-size:.75rem;line-height:1.6;margin-top:28px;max-width:88ch;}
  .copy{color:#6E5E51;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;margin-top:22px;}

  /* ---- CTA FIXO NO CELULAR + WHATSAPP ---- */
  .mobile-cta{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(21,13,9,.96);border-top:1px solid var(--dark-line);padding:12px 18px calc(12px + var(--safe-b));}
  .mobile-cta .row{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .mobile-cta b{display:block;font-family:'Outfit',sans-serif;font-size:1.15rem;font-weight:800;color:var(--gold);}
  .mobile-cta small{color:var(--muted-light);font-size:.7rem;}
  .wa-float{position:fixed;right:16px;bottom:16px;z-index:55;width:50px;height:50px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.6);}
  .wa-float svg{width:25px;height:25px;fill:#fff;}

  /* ---- CHECKLIST INTERATIVO ---- */
  .quiz-card{background:var(--dark-2);border:1px solid var(--dark-line);border-radius:var(--r);padding:10px;margin-top:30px;}
  .quiz-item{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:14px;cursor:pointer;font-size:.94rem;color:var(--text-light);transition:background .15s ease;user-select:none;}
  .quiz-item:hover{background:rgba(247,183,51,.06);}
  .quiz-item.picked{background:rgba(247,183,51,.12);}
  .quiz-check{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--dark-line);margin-top:1px;display:flex;align-items:center;justify-content:center;transition:background .15s ease,border-color .15s ease;}
  .quiz-item.picked .quiz-check{background:var(--gold);border-color:var(--gold);}
  .quiz-item.picked .quiz-check::after{content:"✓";color:#241811;font-size:.72rem;font-weight:800;}
  .quiz-result{padding:22px 18px 18px;text-align:center;border-top:1px solid var(--dark-line);margin-top:6px;}
  .quiz-bar{height:7px;border-radius:20px;background:var(--dark);overflow:hidden;max-width:320px;margin:0 auto 16px;}
  .quiz-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--ember),var(--gold));transition:width .25s ease;}
  .quiz-result p{color:var(--muted-light);font-size:.92rem;margin-bottom:14px;}
  .quiz-result .btn{display:none;}

  /* ---- VÍDEO DE DEPOIMENTO (VERTICAL) ---- */
  .video-vert-wrap{display:flex;justify-content:center;margin-top:30px;}
  .video-vert{width:100%;max-width:300px;aspect-ratio:9/16;border-radius:24px;overflow:hidden;border:1px solid var(--cream-line);background:linear-gradient(160deg,#EFE6D6,#E3D7C1);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;}
  .video-vert p{color:var(--muted-dark);font-size:.82rem;max-width:22ch;}
  .video-vert video,.video-vert img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;}
  .video-caption{color:var(--muted-dark);font-size:.85rem;margin:16px auto 0;max-width:40ch;text-align:center;}

  @media(max-width:900px){
    .hero-grid,.about,.calc{grid-template-columns:1fr;gap:34px;}
    .hero-media{aspect-ratio:16/11;}
    .stat-grid,.bonus-grid{grid-template-columns:1fr 1fr;}
    .testi-grid{grid-template-columns:1fr 1fr;}
    .topbar-note{display:none;}
  }
  @media(max-width:720px){
    section{padding:58px 0;}
    .deliver,.two,.offer-list{grid-template-columns:1fr;}
    .testi-grid{grid-template-columns:1fr;}
    .guarantee{flex-direction:column;text-align:center;}
    .mobile-cta{display:block;}
    body{padding-bottom:calc(80px + var(--safe-b));}
    .wa-float{bottom:calc(86px + var(--safe-b));}
    .topbar .btn{display:none;}
    .timer{margin-left:auto;}
    .offer{padding:30px 22px;}
    .foot-card{padding:26px 22px;}
  }
  @media(max-width:460px){
    .stat-grid,.bonus-grid{grid-template-columns:1fr;}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
    html{scroll-behavior:auto;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="brand">salgados<span>.growth</span></div>
    <div class="timer">⚠ Preço de fundador expira em <b id="timer">09:58</b></div>
    <div class="topbar-note">Turma de fundadores</div>
    <a class="btn btn-sm" href="https://pay.kiwify.com.br/EAsIbs3" target="_blank" rel="noopener noreferrer">Garantir acesso</a>
  </
